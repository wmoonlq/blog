name: Download video via yt-dlp

on:
  push:
    branches: [main]
    paths: ['downloads/queue.json']
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: yt-dlp
  cancel-in-progress: true

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: pip install -q "yt-dlp[default,curl-cffi]"

      - name: Download and commit
        run: |
          python - <<'EOF'
          import glob, json, os, re, subprocess, sys, tempfile, time, urllib.request

          Q = 'downloads/queue.json'
          if not os.path.exists(Q):
              print('::notice::no queue file, nothing to do')
              sys.exit(0)

          try:
              with open(Q, encoding='utf-8') as f:
                  q = json.load(f)
          except Exception as e:
              print(f'::error::queue.json parse failed: {e}')
              sys.exit(1)

          url = str(q.get('url') or '').strip()
          if not url:
              print('::notice::queue is empty, nothing to do')
              sys.exit(0)

          def slugify(s):
              s = re.sub(r'[^\w\u4e00-\u9fa5]+', '-', str(s).strip().lower())
              return re.sub(r'-+', '-', s).strip('-')

          def esc(s):
              s = str(s).replace('\\', '\\\\').replace('"', '\\"')
              return re.sub(r'[\r\n]+', ' ', s)

          def get_bili_cookies(url):
              """bilibili 需要真实 buvid3/buvid4 cookie（WAF 拒绝假值）；从官方 spi 接口获取并写入临时 cookies 文件"""
              if 'bilibili.com' not in url:
                  return None
              ua = ('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
                    '(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36')
              try:
                  req = urllib.request.Request(
                      'https://api.bilibili.com/x/frontend/finger/spi',
                      headers={'User-Agent': ua, 'Referer': 'https://www.bilibili.com/'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.loads(r.read().decode('utf-8'))
                  b3 = (data.get('data') or {}).get('b_3', '')
                  b4 = (data.get('data') or {}).get('b_4', '')
                  if not b3:
                      print('::warning::no buvid3 from spi, download may fail')
                      return None
                  lines = ['# Netscape HTTP Cookie File']
                  for name, val in (('buvid3', b3), ('buvid4', b4)):
                      if val:
                          lines.append(f'.bilibili.com\tTRUE\t/\tFALSE\t2147483647\t{name}\t{val}')
                  ck = os.path.join(tempfile.gettempdir(), 'bili-cookies.txt')
                  with open(ck, 'w', encoding='utf-8') as f:
                      f.write('\n'.join(lines) + '\n')
                  print(f'::notice::bilibili cookies fetched (buvid3={"yes" if b3 else "no"})')
                  return ck
              except Exception as e:
                  print(f'::warning::failed to fetch bilibili cookies: {e}')
                  return None

          title = str(q.get('title') or '').strip()
          slug = slugify(title) or f'video-{int(time.time() * 1000)}'
          if glob.glob(f'src/videos/{slug}.md'):
              slug = f'{slug}-{int(time.time() * 1000)}'

          category = str(q.get('category') or '').strip()
          collection = str(q.get('collection') or '').strip()
          date = str(q.get('date') or time.strftime('%Y-%m-%d')).strip()
          base = f'public/videos/{slug}'

          common = ['yt-dlp', '--no-playlist', '--no-warnings']
          cookies = get_bili_cookies(url)
          if cookies:
              common += ['--cookies', cookies]

          cmd = common + [
              '-f', 'bv*[height<=720]+ba/b[height<=720]',
              '--merge-output-format', 'mp4',
              '--remux-video', 'mp4',
              '--max-filesize', '300M',
              '-o', f'{base}.%(ext)s',
              url,
          ]
          print('::group::yt-dlp download')
          print('running:', ' '.join(cmd))
          if subprocess.run(cmd, text=True).returncode != 0:
              print('::error::yt-dlp download failed')
              sys.exit(1)
          print('::endgroup::')

          image_exts = ('.jpg', '.jpeg', '.png', '.webp')
          media = [p for p in glob.glob(f'{base}.*') if not p.lower().endswith(image_exts)]
          if not media:
              print('::error::no media file produced')
              sys.exit(1)
          media_path = sorted(media)[0]
          media_name = os.path.basename(media_path)

          poster = ''
          thumb_cmd = common + [
              '--skip-download',
              '--write-thumbnail', '--convert-thumbnails', 'jpg',
              '-o', f'{base}-poster.%(ext)s',
              url,
          ]
          subprocess.run(thumb_cmd, text=True)
          for p in sorted(glob.glob(f'{base}-poster.*')):
              if p.lower().endswith(('.jpg', '.jpeg', '.png')):
                  poster = f'/blog/videos/{os.path.basename(p)}'
              else:
                  os.remove(p)

          for p in glob.glob(f'{base}.*'):
              if os.path.basename(p) != media_name and not p.lower().endswith(image_exts):
                  os.remove(p)

          lines = [
              '---',
              f'title: "{esc(title or slug)}"',
              f'date: "{esc(date)}"',
              f'source: "/blog/videos/{media_name}"',
              'type: "video"',
          ]
          if category:
              lines.append(f'category: "{esc(category)}"')
          if collection:
              lines.append(f'collection: "{esc(collection)}"')
          if poster:
              lines.append(f'poster: "{poster}"')
          lines += ['---', '', title or slug]

          with open(f'src/videos/{slug}.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')

          print(f'::notice::downloaded {media_name} -> src/videos/{slug}.md')
          EOF

      - name: Commit, push and trigger deploy
        run: |
          if ! git diff --quiet -- public/videos src/videos; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/videos src/videos
            git commit -m 'feat: download video via yt-dlp' --no-verify
            git push
            gh workflow run deploy.yml --ref main
          else
            echo 'no changes'
          fi